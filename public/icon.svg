<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing emblem circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Center Hex Shield / Box -->
  <rect x="116" y="116" width="280" height="280" rx="64" fill="url(#brandGrad)" filter="url(#shadow)" />

  <!-- C Emblem Stylized Bar -->
  <path d="M 310 186 L 230 186 C 190 186 160 216 160 256 C 160 296 190 326 230 326 L 310 326" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Data Node Points -->
  <circle cx="310" cy="186" r="18" fill="#38bdf8" />
  <circle cx="310" cy="326" r="18" fill="#34d399" />
  <circle cx="210" cy="256" r="14" fill="#ffffff" />
</svg>
